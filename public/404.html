<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Elisabeth Chávez Rivera · Autora</title>
<meta name="description" content="Elisabeth Chávez Rivera, autora de Las hijas de El Camalote y Mechuacán, sus mujeres y el silencio. Libros, agenda literaria 2026 y asesoría para escritores independientes. Todos Santos, Baja California Sur.">
<meta property="og:title" content="Elisabeth Chávez Rivera · Autora">
<meta property="og:description" content="Libros, agenda literaria y asesoría para escritores independientes.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://elisabethchavez.com/">
<meta property="og:image" content="https://elisabethchavez.com/img/elisabeth.jpg">
<link rel="canonical" href="https://elisabethchavez.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23A4502F'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' fill='%23F7F3EC' text-anchor='middle'%3EEC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"Person","name":"Elisabeth Chávez Rivera","url":"https://elisabethchavez.com/","jobTitle":"Escritora y emprendedora","birthPlace":"Tecomán, Colima, México","homeLocation":"Todos Santos, Baja California Sur, México","worksFor":{"@type":"Organization","name":"SEN Group Editorial"}}
</script>
<style>
:root{
  --paper:#F7F3EC; --card:#FFFDF9; --ink:#2B2622; --muted:#62574E; --line:#E4DACB;
  --terra:#A4502F; --terra-ink:#FFFFFF; --green:#3F5B4A; --sand:#EDE3D3; --gold:#B88A4A;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:Karla, "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--terra)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);margin:0 0 10px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0}
h2{font-size:clamp(34px,5vw,52px);margin-bottom:14px}
.lede{color:var(--muted);max-width:640px;margin:0}
section{padding:88px 0}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:15px;font-weight:700;padding:13px 22px;border-radius:999px;text-decoration:none;border:1.5px solid var(--terra);cursor:pointer;min-height:46px}
.btn.solid{background:var(--terra);color:var(--terra-ink)}
.btn.ghost{background:transparent;color:var(--terra)}
.btn:hover{filter:brightness(.95)}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}

/* nav */
.top{position:sticky;top:0;z-index:20;background:rgba(247,243,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.brand{font-family:var(--serif);font-size:24px;font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand small{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-left:8px}
nav ul{list-style:none;display:flex;gap:4px;margin:0;padding:0;flex-wrap:wrap}
nav a{display:block;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:15px;font-weight:500}
nav a:hover{background:var(--sand)}
.lang{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;min-height:38px}
.menu-btn{display:none}
@media (max-width:880px){
  nav ul{display:none;position:absolute;left:0;right:0;top:68px;background:var(--paper);border-bottom:1px solid var(--line);flex-direction:column;padding:10px 16px 16px}
  nav.open ul{display:flex}
  .menu-btn{display:inline-flex;font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:7px 14px;min-height:38px;cursor:pointer;color:var(--ink)}
  .brand small{display:none}
}

/* hero */
.hero{padding:72px 0 64px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:56px;align-items:center}
.hero h1{font-size:clamp(48px,7.5vw,92px);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--terra);font-weight:500}
.hero p.sub{font-size:20px;color:var(--muted);max-width:560px;margin:22px 0 30px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px}
.next{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 18px 40px -28px rgba(43,38,34,.35)}
.next .eyebrow{color:var(--green)}
.next h3{font-size:30px;margin:4px 0 8px}
.next p{margin:0;color:var(--muted);font-size:15px}
.next .when{display:flex;gap:14px;align-items:center;margin:14px 0 18px}
.datebox{flex-shrink:0;width:70px;height:74px;border-radius:16px;background:var(--terra);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.datebox b{font-family:var(--serif);font-size:34px}
.datebox span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
@media (max-width:880px){.hero .wrap{grid-template-columns:1fr;gap:36px}}

/* books */
#libros{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px;margin-top:40px}
.book{display:flex;flex-direction:column;gap:12px}
.cover{aspect-ratio:2/3;border-radius:6px 14px 14px 6px;padding:22px 18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:inset 6px 0 0 rgba(0,0,0,.14),0 22px 30px -22px rgba(43,38,34,.6);position:relative;overflow:hidden}
.cover h3{font-size:27px;line-height:1.02}
.cover small{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.cover svg{position:absolute;right:-20px;bottom:-12px;width:150px;opacity:.22}
.c1{background:#A4502F}.c2{background:#3F5B4A}.c3{background:#6B4E7A}.c4{background:#B88A4A}.c5{background:#2F4A62}
.book .meta{font-size:14px;color:var(--muted);margin:0}
.book .t{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.1}
.book .actions{display:flex;flex-wrap:wrap;gap:8px}
.book .actions a{font-size:13px;font-weight:700;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);background:var(--paper)}
.book .actions a.main{border-color:var(--terra);color:var(--terra)}
.todo{background:#FFF4D6;border-radius:4px;padding:0 3px}

/* about */
.about .wrap{display:grid;grid-template-columns:minmax(0,.75fr) minmax(0,1.25fr);gap:64px;align-items:start}
.portrait{position:sticky;top:96px}
.portrait img{width:100%;aspect-ratio:3/4.3;object-fit:cover;border-radius:220px 220px 24px 24px}
.portrait figcaption{font-size:14px;color:var(--muted);text-align:center;margin-top:12px;font-style:italic}
.bio p{margin:0 0 18px}
.bio p.first{font-family:var(--serif);font-size:25px;line-height:1.35;color:var(--ink)}
.timeline{list-style:none;padding:0;margin:30px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.timeline li{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.timeline b{font-family:var(--serif);font-size:24px;color:var(--terra);display:block;line-height:1}
.timeline span{font-size:14.5px;color:var(--muted)}
@media (max-width:880px){.about .wrap{grid-template-columns:1fr;gap:36px}.portrait{position:static;max-width:340px;margin:0 auto}.timeline{grid-template-columns:1fr}}

/* agenda */
#agenda{background:var(--green);color:#F3EFE6}
#agenda .eyebrow{color:#E8C9A0}
#agenda .lede{color:#D9E0D9}
.events{list-style:none;margin:40px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.ev{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:22px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:18px 22px}
.ev .d{font-family:var(--serif);line-height:1;text-align:center}
.ev .d b{display:block;font-size:40px}
.ev .d span{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.ev h3{font-size:25px;margin-bottom:4px}
.ev p{margin:0;font-size:15px;color:#D9E0D9}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:#E8C9A0;color:#2B2622;white-space:nowrap}
.ev.past{opacity:.6}
.ev.past .tag{background:transparent;color:#F3EFE6;border:1px solid rgba(255,255,255,.4)}
.past-title{font-family:var(--serif);font-size:26px;margin:44px 0 0}
@media (max-width:700px){.ev{grid-template-columns:70px minmax(0,1fr)}.ev .tag{grid-column:2;justify-self:start}.ev .d b{font-size:32px}}
.clubs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:40px}
.clubs div{border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:18px 22px}
.clubs h3{font-size:24px}
.clubs p{margin:4px 0 0;font-size:15px;color:#D9E0D9}
@media (max-width:700px){.clubs{grid-template-columns:1fr}}

/* services */
.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:40px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:30px;display:flex;flex-direction:column;gap:12px}
.svc .num{font-family:var(--serif);font-size:56px;line-height:.8;color:var(--terra)}
.svc h3{font-size:32px}
.svc p{margin:0;color:var(--muted)}
.svc ul{margin:0;padding-left:20px;color:var(--ink)}
.svc .btn{align-self:flex-start;margin-top:auto}
@media (max-width:760px){.services{grid-template-columns:1fr}}

/* bookstores */
#librerias{padding-top:0}
.stores{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.stores span{font-family:var(--serif);font-size:24px;font-weight:600;padding:10px 22px;border-radius:999px;background:var(--card);border:1px solid var(--line)}

/* contact */
#contacto{background:var(--sand)}
.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:48px;align-items:start}
.contact form{background:var(--card);border-radius:26px;padding:28px;display:grid;gap:14px;border:1px solid var(--line)}
.contact label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.contact input,.contact select,.contact textarea{font:inherit;font-size:16px;font-weight:400;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.contact textarea{min-height:130px;resize:vertical}
.contact .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.contact .note{font-size:13px;color:var(--muted);margin:0}
.mail{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--terra)}
@media (max-width:880px){.contact{grid-template-columns:1fr}.contact .row{grid-template-columns:1fr}}

footer{padding:36px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
footer a{color:var(--muted)}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#inicio">Elisabeth Chávez<small data-en="Author">Autora</small></a>
    <nav id="nav" aria-label="Menú principal">
      <ul>
        <li><a href="#libros" data-en="Books">Libros</a></li>
        <li><a href="#sobre" data-en="About the author">Sobre la autora</a></li>
        <li><a href="#agenda" data-en="2026 events">Agenda 2026</a></li>
        <li><a href="#servicios" data-en="For writers">Para escritores</a></li>
        <li><a href="#contacto" data-en="Contact">Contacto</a></li>
      </ul>
    </nav>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="lang" id="lang" type="button" aria-label="Switch to English">EN</button>
      <button class="menu-btn" id="menu" type="button" aria-expanded="false" aria-controls="nav" data-en="Menu">Menú</button>
    </div>
  </div>
</header>

<main id="inicio" style="min-height:50vh;display:grid;place-items:center;text-align:center"><div><h2>Página no encontrada</h2><p><a href="/">Volver al inicio</a></p></div></main>

<footer>
  <div class="wrap">
    <span>© <span id="yr">2026</span> Elisabeth Chávez Rivera · SEN Group Editorial</span>
    <span data-en="Todos Santos, Baja California Sur, Mexico">Todos Santos, Baja California Sur, México</span>
  </div>
</footer>

<script>
(function(){
  // past events move to their own list automatically
  var today=new Date(); today.setHours(0,0,0,0);
  var up=document.getElementById('events'), past=document.getElementById('past');
  var items=[].slice.call(up.querySelectorAll('.ev'));
  items.sort(function(a,b){return a.dataset.date<b.dataset.date?-1:1;});
  items.forEach(function(li){
    var d=new Date(li.dataset.date+'T23:59:00');
    if(d<today){li.classList.add('past');var t=li.querySelector('.tag');t.textContent='Realizada';t.setAttribute('data-en','Done');past.insertBefore(li,past.firstChild);}
    else up.appendChild(li);
  });
  if(past.children.length) document.getElementById('past-title').hidden=false;
  var first=up.querySelector('.ev'), box=document.getElementById('next-box');
  if(first){box.innerHTML='<h3>'+first.querySelector('h3').innerHTML+'</h3><div class="when"><div class="datebox">'+first.querySelector('.d').innerHTML+'</div></div>';
    box.querySelector('.when').appendChild(first.querySelector('div:not(.d) p').cloneNode(true));}
  else box.closest('.next').hidden=true;

  // language toggle: Spanish is in the page, English in data-en
  var KEY='ec-lang', lang='es';
  try{ lang=new URLSearchParams(location.search).get('l')||localStorage.getItem(KEY)||((navigator.language||'').slice(0,2)==='en'?'en':'es'); }catch(e){}
  function apply(l){
    lang=l; document.documentElement.lang=l;
    document.querySelectorAll('[data-en]').forEach(function(el){
      if(el.dataset.es===undefined) el.dataset.es=el.innerHTML;
      el.innerHTML = l==='en' ? el.dataset.en : el.dataset.es;
    });
    var b=document.getElementById('lang'); b.textContent=l==='en'?'ES':'EN'; b.setAttribute('aria-label', l==='en'?'Cambiar a español':'Switch to English');
    try{localStorage.setItem(KEY,l);}catch(e){}
  }
  document.getElementById('lang').addEventListener('click',function(){apply(lang==='en'?'es':'en');});
  if(lang==='en') apply('en');

  // mobile menu
  var nav=document.getElementById('nav'), mb=document.getElementById('menu');
  mb.addEventListener('click',function(){var o=nav.classList.toggle('open'); mb.setAttribute('aria-expanded',o);});
  nav.addEventListener('click',function(e){if(e.target.tagName==='A'){nav.classList.remove('open'); mb.setAttribute('aria-expanded','false');}});

  // buttons that prefill the form
  var topic=document.getElementById('f-topic'), msg=document.getElementById('f-msg');
  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-book],[data-svc]'); if(!a) return;
    if(a.dataset.book){topic.selectedIndex=0; msg.value=(lang==='en'?'Hi Elisabeth, I would like to order: ':'Hola Elisabeth, me gustaría pedir: ')+a.dataset.book;}
    if(a.dataset.svc){topic.selectedIndex=a.dataset.svc.indexOf('Revisión')===0?5:4;}
  });

  // form opens the visitor's email app (no data stored on the site)
  document.getElementById('form').addEventListener('submit',function(e){
    e.preventDefault();
    var n=document.getElementById('f-name').value.trim(), m=document.getElementById('f-email').value.trim();
    if(!n||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){var fn=document.getElementById('f-note');fn.textContent=lang==='en'?'Please write your name and a valid email.':'Escribe tu nombre y un correo válido.';fn.style.color='#A4502F';return;}
    var subj=topic.options[topic.selectedIndex].text+' · '+n;
    var body=msg.value+'\n\n'+n+' · '+m;
    location.href='mailto:contacto@elisabethchavez.com?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
  });
  document.getElementById('yr').textContent=new Date().getFullYear();
})();
</script>
</body>
</html>
